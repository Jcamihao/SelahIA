name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Bloqueiam o merge.
      - name: Lint (eslint + prettier, sem --fix)
        run: npx eslint "{src,test}/**/*.ts"
      - name: Build
        run: npm run build
      - name: Testes unitarios
        run: npx jest --ci
      - name: Testes e2e
        run: npm run test:e2e -- --ci

  # Informativo: nao bloqueia. As vulnerabilidades so saem com upgrade major do NestJS
  # (ver HANDOFF.md, "Dividas conhecidas"). Remova o continue-on-error quando forem resolvidas.
  advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit das dependencias de producao
        run: npm audit --omit=dev
