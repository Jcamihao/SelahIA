name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Bloqueiam o merge.
      - name: Lint (eslint + prettier, sem --fix)
        run: npx eslint "{src,test}/**/*.ts"
      - name: Build
        run: npm run build
      - name: Testes unitarios
        run: npx jest --ci
      - name: Testes e2e
        run: npm run test:e2e -- --ci
      # Dependencias de producao (as que vao para a imagem). Bloqueia em nivel alto ou critico.
      # O audit de devDependencies nao entra: o que sobra la e ferramental (jest, eslint, nest cli)
      # e os "fixes" que o npm sugere sao downgrades (ver HANDOFF.md, "Dividas conhecidas").
      - name: Audit das dependencias de producao
        run: npm audit --omit=dev --audit-level=high
