# Producao do SelahIA na VPS (selah.financelumen.tech).
# Aplicar em /etc/nginx/sites-available/selah.conf. Exige o registro A
# `selah` -> IP da VPS e o certificado emitido via certbot (webroot /var/www/certbot).

# Protecao grosseira por IP contra rajadas (o limite por app fica no proprio Selah).
# limit_req_zone precisa estar no contexto http; este arquivo e incluido la dentro.
limit_req_zone $binary_remote_addr zone=selah_api:10m rate=20r/s;

server {
    listen 80;
    server_name selah.financelumen.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name selah.financelumen.tech;

    ssl_certificate     /etc/letsencrypt/live/selah.financelumen.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selah.financelumen.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Payloads de IA (recibos em base64 etc.) e respostas lentas de LLM.
    client_max_body_size 20m;
    proxy_read_timeout   120s;

    location / {
        limit_req          zone=selah_api burst=40 nodelay;
        limit_req_status   429;

        proxy_pass         http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
