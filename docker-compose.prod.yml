services:
  selah-ia:
    build:
      context: .
    restart: unless-stopped
    # Tempo para terminar requisicoes em andamento (chamadas de LLM chegam a 45s) antes do SIGKILL.
    stop_grace_period: 50s
    env_file:
      - .env.production
    environment:
      PORT: 3010
      NODE_ENV: production
    ports:
      - '127.0.0.1:${SELAH_HOST_PORT:-3020}:3010'
